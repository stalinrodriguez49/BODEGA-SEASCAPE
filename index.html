<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BODEGA SEASCAPE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font:16px system-ui;
  background:#f1f5f2;
  color:#17251b;
}

header{
  background:#166534;
  color:white;
  padding:22px 18px;
}

h1{margin:0;font-size:23px}
header p{margin:5px 0 0;opacity:.85}

.wrap{
  max-width:760px;
  margin:auto;
  padding:14px;
}

.hidden{display:none!important}

.login-wrap{
  max-width:420px;
  margin:35px auto;
  padding:14px;
}

.card,.panel{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 2px 12px #102b1515;
}

.card h2{
  margin-top:0;
  color:#166534;
}

label{
  display:block;
  font-weight:700;
  margin:12px 0 5px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5ce;
  border-radius:9px;
  font-size:16px;
  background:white;
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 14px;
  font-weight:700;
  background:#166534;
  color:white;
  cursor:pointer;
}

.full{
  width:100%;
  margin-top:14px;
}

.status{
  margin-top:14px;
  font-weight:700;
  font-size:14px;
  word-break:break-word;
}

.userbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  background:#e5f1e8;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}

.userbar strong{
  display:block;
}

.email{
  font-size:13px;
  color:#52705b;
  word-break:break-all;
}

.logout{
  border:0;
  border-radius:9px;
  padding:9px 11px;
  background:#b42318;
  color:white;
  font-weight:700;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#e5f1e8;
  padding:14px;
  border-radius:12px;
}

.stat strong{
  display:block;
  font-size:24px;
  color:#166534;
}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:14px 0;
}

.tabs button{
  border:0;
  border-radius:10px;
  padding:12px 14px;
  font-weight:700;
  background:#dce9df;
  color:#164d2b;
}

.tabs button.active{
  background:#166534;
  color:white;
}

.panel{
  margin:12px 0;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.item{
  border-bottom:1px solid #e4e9e5;
  padding:12px 0;
}

.item:last-child{border:0}

.qty{
  font-size:20px;
  font-weight:800;
  color:#166534;
}

.muted{
  color:#637168;
  font-size:13px;
}

.responsable{
  color:#166534;
  font-weight:700;
  font-size:14px;
  margin-top:4px;
}

.empty{
  text-align:center;
  padding:20px;
  color:#68766c;
}

.secondary{
  background:#e5eee7;
  color:#164d2b;
}
</style>
</head>

<body>

<header>
  <h1>📦 BODEGA SEASCAPE</h1>
  <p>Control de inventario · Firebase</p>
</header>


<!-- LOGIN -->

<div id="loginScreen" class="login-wrap">

  <div class="card">

    <h2>🔐 Iniciar sesión</h2>

    <p class="muted">
      Ingresa con tu usuario o correo.
    </p>

    <form id="loginForm">

      <label>Usuario o correo</label>

      <input
        id="loginUser"
        type="text"
        autocomplete="username"
        required
      >

      <label>Contraseña</label>

      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        required
      >

      <button
        id="loginBtn"
        class="btn full"
        type="submit"
      >
        Ingresar
      </button>

    </form>

    <div id="status" class="status">
      🟡 Preparando Firebase...
    </div>

  </div>

</div>


<!-- APP -->

<main id="appScreen" class="wrap hidden">

  <div class="userbar">

    <div>

      <strong id="userName">
        👤 Usuario
      </strong>

      <div id="userEmail" class="email"></div>

    </div>

    <button
      id="logoutBtn"
      class="logout"
      type="button"
    >
      Cerrar sesión
    </button>

  </div>


  <div class="stats">

    <div class="stat">
      Tipos de materiales
      <strong id="count">0</strong>
    </div>

    <div class="stat">
      Movimientos hoy
      <strong id="today">0</strong>
    </div>

  </div>


  <div class="tabs">

    <button
      id="tabStock"
      class="active"
      type="button"
    >
      Inventario
    </button>

    <button
      id="tabMove"
      type="button"
    >
      Entrada / salida
    </button>

    <button
      id="tabHistory"
      type="button"
    >
      Historial
    </button>

  </div>


  <!-- INVENTARIO -->

  <section id="stockPanel" class="panel">

    <h2>Inventario actual</h2>

    <form id="addForm">

      <label>Nombre del material</label>

      <input
        id="material"
        required
      >

      <div class="row">

        <div>

          <label>Cantidad inicial</label>

          <input
            id="amount"
            type="number"
            min="0"
            step="any"
            required
          >

        </div>

        <div>

          <label>Unidad</label>

          <input
            id="unit"
            placeholder="sacos, kg, unidades..."
            required
          >

        </div>

      </div>

      <button class="btn full">
        Agregar material
      </button>

    </form>

    <div id="stockList"></div>

  </section>


  <!-- MOVIMIENTOS -->

  <section
    id="movePanel"
    class="panel hidden"
  >

    <h2>Registrar movimiento</h2>

    <form id="moveForm">

      <label>Tipo</label>

      <select id="kind">

        <option value="Salida">
          Salida
        </option>

        <option value="Entrada">
          Entrada
        </option>

      </select>

      <label>Material</label>

      <select id="pick"></select>

      <label>Cantidad</label>

      <input
        id="qty"
        type="number"
        min=".001"
        step="any"
        required
      >

      <label>Nota</label>

      <input
        id="note"
        placeholder="Opcional"
      >

      <button class="btn full">
        Guardar movimiento
      </button>

    </form>

    <p class="muted">
      El responsable se registra automáticamente.
    </p>

  </section>


  <!-- HISTORIAL -->

  <section
    id="historyPanel"
    class="panel hidden"
  >

    <h2>Historial</h2>

    <label>Fecha</label>

    <input
      id="filterDate"
      type="date"
    >

    <div id="historyList"></div>

    <button
      id="exportBtn"
      class="btn secondary full"
      type="button"
    >
      Exportar CSV
    </button>

  </section>

</main>


<script type="module">

/*
========================================
FIREBASE
========================================
*/

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDoc,
  addDoc,
  doc,
  updateDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBjJ_SbNo9pA8IE7mP_2v3UnIGkY0IzjF0",

  authDomain:
    "bodega-seascape.firebaseapp.com",

  projectId:
    "bodega-seascape",

  storageBucket:
    "bodega-seascape.firebasestorage.app",

  messagingSenderId:
    "634162820624",

  appId:
    "1:634162820624:web:6d67c35de7667fe07efc95"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/*
========================================
VARIABLES
========================================
*/

let stock = [];

let moves = [];

let detenerMateriales = null;

let detenerMovimientos = null;

let usuarioActual = {
  uid:"",
  nombre:"",
  email:""
};


/*
========================================
ELEMENTOS
========================================
*/

const loginScreen =
  document.getElementById("loginScreen");

const appScreen =
  document.getElementById("appScreen");

const loginForm =
  document.getElementById("loginForm");

const loginBtn =
  document.getElementById("loginBtn");

const status =
  document.getElementById("status");

const userName =
  document.getElementById("userName");

const userEmail =
  document.getElementById("userEmail");


status.style.color =
  "#166534";

status.textContent =
  "🟢 Firebase cargado. Puedes iniciar sesión.";


/*
========================================
CONVERTIR USUARIO A CORREO
========================================
*/

function obtenerCorreo(valor){

  const usuario =
    valor
      .trim()
      .toLowerCase();


  /*
  Si escribió un correo completo,
  lo dejamos exactamente como está.
  Esto permite que Stalin use Gmail.
  */

  if(usuario.includes("@")){

    return usuario;

  }


  /*
  Si escribió solamente el usuario,
  agregamos el correo interno.
  */

  return (
    usuario +
    "@bodegaseascape.com"
  );

}


/*
========================================
LOGIN
========================================
*/

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const usuario =
      document
        .getElementById("loginUser")
        .value
        .trim();


    const password =
      document
        .getElementById("loginPassword")
        .value;


    const email =
      obtenerCorreo(usuario);


    loginBtn.disabled = true;

    loginBtn.textContent =
      "Ingresando...";


    status.style.color =
      "#166534";

    status.textContent =
      "Verificando cuenta...";


    try{

      const resultado =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      status.textContent =
        "Acceso correcto.";


    }catch(error){

      console.error(error);


      status.style.color =
        "#b42318";


      status.textContent =
        "❌ Usuario o contraseña incorrectos.";

    }finally{

      loginBtn.disabled = false;

      loginBtn.textContent =
        "Ingresar";

    }

  }
);


/*
========================================
SESIÓN
========================================
*/

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      detenerTiempoReal();


      appScreen
        .classList
        .add("hidden");


      loginScreen
        .classList
        .remove("hidden");


      usuarioActual = {
        uid:"",
        nombre:"",
        email:""
      };


      return;

    }


    usuarioActual = {

      uid:
        user.uid,

      nombre:
        user.email ||
        "Usuario",

      email:
        user.email ||
        ""

    };


    userName.textContent =
      "👤 " +
      usuarioActual.nombre;


    userEmail.textContent =
      usuarioActual.email;


    loginScreen
      .classList
      .add("hidden");


    appScreen
      .classList
      .remove("hidden");


    /*
    BUSCAR PERFIL DEL USUARIO
    */

    try{

      const perfil =
        await getDoc(
          doc(
            db,
            "usuarios",
            user.uid
          )
        );


      if(perfil.exists()){

        const datos =
          perfil.data();


        /*
        COMPROBAR SI LA CUENTA
        ESTÁ ACTIVA
        */

        if(datos.activo === false){

          alert(
            "Esta cuenta está desactivada."
          );


          await signOut(auth);

          return;

        }


        usuarioActual.nombre =
          datos.nombre ||
          usuarioActual.nombre;


        userName.textContent =
          "👤 " +
          usuarioActual.nombre;

      }


    }catch(error){

      console.error(
        "Error perfil:",
        error
      );

    }


    /*
    ACTIVAR TIEMPO REAL
    */

    iniciarTiempoReal();

  }
);


/*
========================================
CERRAR SESIÓN
========================================
*/

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      detenerTiempoReal();

      await signOut(auth);

    }
  );


/*
========================================
UTILIDADES
========================================
*/

function esc(valor){

  return String(
    valor ?? ""
  ).replace(
    /[&<>"']/g,
    c => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[c])
  );

}


function fechaISO(valor){

  if(
    valor &&
    typeof valor.toDate === "function"
  ){

    return valor
      .toDate()
      .toISOString();

  }


  const fecha =
    new Date(valor);


  if(
    !isNaN(
      fecha.getTime()
    )
  ){

    return fecha
      .toISOString();

  }


  return new Date()
    .toISOString();

}


function fechaLocal(fecha = new Date()){

  const a =
    fecha.getFullYear();


  const m =
    String(
      fecha.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const d =
    String(
      fecha.getDate()
    ).padStart(
      2,
      "0"
    );


  return `${a}-${m}-${d}`;

}


/*
========================================
TIEMPO REAL
========================================
*/

function iniciarTiempoReal(){

  detenerTiempoReal();


  /*
  MATERIALES
  */

  detenerMateriales =
    onSnapshot(
      collection(
        db,
        "materiales"
      ),

      snapshot => {

        stock =
          snapshot.docs.map(
            documento => {

              const x =
                documento.data();


              return {

                id:
                  documento.id,

                name:
                  x.nombre ||
                  x.name ||
                  "Sin nombre",

                unit:
                  x.unidad ||
                  x.unit ||
                  "",

                qty:
                  Number(
                    x.cantidad ??
                    x.qty ??
                    0
                  )

              };

            }
          );


        render();

      },

      error => {

        console.error(
          "Error sincronizando materiales:",
          error
        );

      }
    );


  /*
  MOVIMIENTOS
  */

  detenerMovimientos =
    onSnapshot(
      collection(
        db,
        "movimientos"
      ),

      snapshot => {

        moves =
          snapshot.docs.map(
            documento => {

              const x =
                documento.data();


              return {

                id:
                  documento.id,

                date:
                  fechaISO(
                    x.fecha ||
                    x.date
                  ),

                name:
                  x.nombre ||
                  x.name ||
                  "",

                unit:
                  x.unidad ||
                  x.unit ||
                  "",

                kind:
                  x.tipo ||
                  x.kind ||
                  "",

                qty:
                  Number(
                    x.cantidad ??
                    x.qty ??
                    0
                  ),

                note:
                  x.nota ||
                  x.note ||
                  "",

                responsableNombre:
                  x.responsableNombre ||
                  "",

                responsableUid:
                  x.responsableUid ||
                  ""

              };

            }
          );


        moves.sort(
          (a,b) =>
            new Date(b.date) -
            new Date(a.date)
        );


        render();

      },

      error => {

        console.error(
          "Error sincronizando movimientos:",
          error
        );

      }
    );

}


function detenerTiempoReal(){

  if(detenerMateriales){

    detenerMateriales();

    detenerMateriales = null;

  }


  if(detenerMovimientos){

    detenerMovimientos();

    detenerMovimientos = null;

  }

}


/*
========================================
AGREGAR MATERIAL
========================================
*/

document
  .getElementById("addForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const name =
        document
          .getElementById("material")
          .value
          .trim();


      const amount =
        Number(
          document
            .getElementById("amount")
            .value
        );


      const unit =
        document
          .getElementById("unit")
          .value
          .trim();


      if(
        stock.some(
          x =>
            x.name.toLowerCase()
            ===
            name.toLowerCase()
        )
      ){

        alert(
          "Ese material ya existe."
        );

        return;

      }


      try{

        await addDoc(
          collection(
            db,
            "materiales"
          ),
          {

            nombre:name,

            cantidad:amount,

            unidad:unit

          }
        );


        event.target.reset();


        alert(
          "Material guardado."
        );


      }catch(error){

        console.error(error);


        alert(
          "No se pudo guardar el material."
        );

      }

    }
  );


/*
========================================
MOVIMIENTOS
========================================
*/

document
  .getElementById("moveForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const id =
        document
          .getElementById("pick")
          .value;


      const material =
        stock.find(
          x =>
            x.id === id
        );


      if(!material){

        alert(
          "Selecciona un material."
        );

        return;

      }


      const tipo =
        document
          .getElementById("kind")
          .value;


      const cantidad =
        Number(
          document
            .getElementById("qty")
            .value
        );


      const nota =
        document
          .getElementById("note")
          .value
          .trim();


      if(
        cantidad <= 0
      ){

        alert(
          "Cantidad inválida."
        );

        return;

      }


      if(
        tipo === "Salida" &&
        cantidad >
        material.qty
      ){

        alert(
          "No hay suficiente existencia."
        );

        return;

      }


      const nuevaCantidad =
        tipo === "Entrada"
        ?
        material.qty +
        cantidad
        :
        material.qty -
        cantidad;


      try{

        await updateDoc(
          doc(
            db,
            "materiales",
            material.id
          ),
          {

            cantidad:
              nuevaCantidad

          }
        );


        await addDoc(
          collection(
            db,
            "movimientos"
          ),
          {

            nombre:
              material.name,

            unidad:
              material.unit,

            tipo:
              tipo,

            cantidad:
              cantidad,

            nota:
              nota,

            fecha:
              new Date(),

            responsableNombre:
              usuarioActual.nombre,

            responsableUid:
              usuarioActual.uid

          }
        );


        event.target.reset();


        alert(
          "Movimiento guardado por " +
          usuarioActual.nombre
        );


      }catch(error){

        console.error(error);


        alert(
          "No se pudo guardar el movimiento."
        );

      }

    }
  );


/*
========================================
PESTAÑAS
========================================
*/

const panels = {

  stock:
    document.getElementById(
      "stockPanel"
    ),

  move:
    document.getElementById(
      "movePanel"
    ),

  history:
    document.getElementById(
      "historyPanel"
    )

};


function abrirPanel(
  nombre,
  boton
){

  Object.values(
    panels
  ).forEach(
    panel =>
      panel.classList.add(
        "hidden"
      )
  );


  panels[nombre]
    .classList
    .remove("hidden");


  document
    .querySelectorAll(
      ".tabs button"
    )
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );


  boton.classList.add(
    "active"
  );


  render();

}


document
  .getElementById("tabStock")
  .addEventListener(
    "click",
    function(){

      abrirPanel(
        "stock",
        this
      );

    }
  );


document
  .getElementById("tabMove")
  .addEventListener(
    "click",
    function(){

      abrirPanel(
        "move",
        this
      );

    }
  );


document
  .getElementById("tabHistory")
  .addEventListener(
    "click",
    function(){

      abrirPanel(
        "history",
        this
      );

    }
  );


/*
========================================
FECHA
========================================
*/

document
  .getElementById("filterDate")
  .value =
    fechaLocal();


document
  .getElementById("filterDate")
  .addEventListener(
    "change",
    render
  );


/*
========================================
RENDER
========================================
*/

function render(){

  document
    .getElementById("count")
    .textContent =
      stock.length;


  const hoy =
    fechaLocal();


  document
    .getElementById("today")
    .textContent =
      moves.filter(
        x =>
          fechaLocal(
            new Date(x.date)
          ) === hoy
      ).length;


  document
    .getElementById("stockList")
    .innerHTML =

      stock.length
      ?

      stock.map(
        x => `

          <div class="item">

            <b>
              ${esc(x.name)}
            </b>

            <div class="qty">

              ${x.qty}
              ${esc(x.unit)}

            </div>

          </div>

        `
      ).join("")

      :

      `
        <div class="empty">
          No hay materiales.
        </div>
      `;


  document
    .getElementById("pick")
    .innerHTML =

      stock.map(
        x => `

          <option value="${esc(x.id)}">

            ${esc(x.name)}
            —
            ${x.qty}
            ${esc(x.unit)}

          </option>

        `
      ).join("");


  const filtro =
    document
      .getElementById("filterDate")
      .value;


  const filtrados =
    moves.filter(
      x =>
        fechaLocal(
          new Date(x.date)
        ) === filtro
    );


  document
    .getElementById("historyList")
    .innerHTML =

      filtrados.length
      ?

      filtrados.map(
        x => {

          const responsable =
            x.responsableNombre
            ?
            "👤 Responsable: " +
            esc(
              x.responsableNombre
            )
            :
            "👤 Responsable: No registrado";


          return `

            <div class="item">

              <b>

                ${
                  x.kind === "Entrada"
                  ?
                  "🟢 Entrada"
                  :
                  "🔴 Salida"
                }:

                ${esc(x.name)}

              </b>

              <div>

                ${x.qty}
                ${esc(x.unit)}

                ·

                ${
                  new Date(
                    x.date
                  ).toLocaleTimeString(
                    "es-EC",
                    {
                      hour:"2-digit",
                      minute:"2-digit"
                    }
                  )
                }

              </div>

              <div class="responsable">

                ${responsable}

              </div>

              <div class="muted">

                ${
                  esc(
                    x.note ||
                    "Sin nota"
                  )
                }

              </div>

            </div>

          `;

        }
      ).join("")

      :

      `
        <div class="empty">
          No hay movimientos para esta fecha.
        </div>
      `;

}


/*
========================================
EXPORTAR CSV
========================================
*/

document
  .getElementById("exportBtn")
  .addEventListener(
    "click",
    () => {

      const filas = [

        [
          "Fecha",
          "Hora",
          "Movimiento",
          "Material",
          "Cantidad",
          "Unidad",
          "Responsable",
          "Nota"
        ],

        ...moves.map(
          x => {

            const fecha =
              new Date(x.date);


            return [

              fecha.toLocaleDateString(
                "es-EC"
              ),

              fecha.toLocaleTimeString(
                "es-EC"
              ),

              x.kind,

              x.name,

              x.qty,

              x.unit,

              x.responsableNombre ||
              "No registrado",

              x.note

            ];

          }
        )

      ];


      const csv =
        filas.map(
          fila =>
            fila.map(
              valor =>
                '"' +
                String(
                  valor ?? ""
                ).replace(
                  /"/g,
                  '""'
                ) +
                '"'
            ).join(";")
        ).join("\r\n");


      const blob =
        new Blob(
          [
            "\ufeff" +
            csv
          ],
          {
            type:
              "text/csv;charset=utf-8;"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      a.download =
        "BODEGA_SEASCAPE_historial.csv";


      a.click();


      URL.revokeObjectURL(
        url
      );

    }
  );

</script>

</html>
