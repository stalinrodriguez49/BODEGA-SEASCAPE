<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>BODEGA SEASCAPE</title>

<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:6px 0 0;
  color:#d1d5db;
}

.status{
  margin:12px;
  padding:12px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}

.wait{
  background:#fef3c7;
  color:#92400e;
}

.ok{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

nav{
  display:flex;
  background:white;
  border-bottom:1px solid #ddd;
}

nav button{
  flex:1;
  padding:14px 5px;
  border:0;
  background:white;
  font-weight:bold;
}

nav button.active{
  background:#111827;
  color:white;
}

section{
  display:none;
  padding:15px;
}

section.active{
  display:block;
}

.card{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 6px #0001;
}

input,
select,
button{
  width:100%;
  padding:11px;
  margin:5px 0;
  border-radius:7px;
  border:1px solid #ccc;
  font-size:15px;
}

button.primary{
  background:#111827;
  color:white;
  border:none;
}

.material{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.material:last-child{
  border-bottom:0;
}

.qty{
  font-size:20px;
  font-weight:bold;
}

.badge{
  padding:4px 7px;
  border-radius:5px;
  font-size:12px;
  font-weight:bold;
}

.entry{
  background:#dcfce7;
  color:#166534;
}

.exit{
  background:#fee2e2;
  color:#991b1b;
}

.history-item{
  border-bottom:1px solid #eee;
  padding:10px 0;
}

.history-item:last-child{
  border-bottom:0;
}

.small{
  color:#6b7280;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>📦 BODEGA SEASCAPE</h1>
  <p>Control de inventario · Sincronizado</p>
</header>

<div id="status" class="status wait">
  🟡 Conectando con Firebase...
</div>

<nav>
  <button class="active" onclick="mostrarSeccion('inventario',this)">
    📦 Inventario
  </button>

  <button onclick="mostrarSeccion('movimientos',this)">
    🔄 Entrada/Salida
  </button>

  <button onclick="mostrarSeccion('historial',this)">
    📋 Historial
  </button>
</nav>

<section id="inventario" class="active">

  <div class="card">

    <h2>➕ Agregar material</h2>

    <input
      id="nuevoNombre"
      placeholder="Nombre del material"
    >

    <input
      id="nuevaCantidad"
      type="number"
      step="0.01"
      placeholder="Cantidad inicial"
    >

    <input
      id="nuevaUnidad"
      placeholder="Unidad (sacos, kg, unidades...)"
    >

    <button
      class="primary"
      onclick="agregarMaterial()"
    >
      Agregar material
    </button>

  </div>

  <div class="card">

    <h2>📦 Inventario</h2>

    <div id="listaMateriales">
      Cargando...
    </div>

  </div>

</section>

<section id="movimientos">

  <div class="card">

    <h2>🔄 Registrar movimiento</h2>

    <select id="materialMovimiento">
      <option value="">
        Seleccionar material
      </option>
    </select>

    <select id="tipoMovimiento">

      <option value="entrada">
        Entrada
      </option>

      <option value="salida">
        Salida
      </option>

    </select>

    <input
      id="cantidadMovimiento"
      type="number"
      step="0.01"
      placeholder="Cantidad"
    >

    <input
      id="notaMovimiento"
      placeholder="Nota (opcional)"
    >

    <button
      class="primary"
      onclick="registrarMovimiento()"
    >
      Registrar movimiento
    </button>

  </div>

</section>

<section id="historial">

  <div class="card">

    <h2>📋 Historial</h2>

    <input
      id="filtroFecha"
      type="date"
      onchange="aplicarFiltro()"
    >

    <button onclick="limpiarFiltro()">
      Mostrar todo
    </button>

    <button
      class="primary"
      onclick="exportarCSV()"
    >
      📄 Exportar CSV
    </button>

    <div id="listaHistorial">
      Cargando...
    </div>

  </div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp,
  runTransaction,
  doc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBjJ_SbNo9pA8IE7mP_2v3UnkY0IzjF0",

  authDomain:
    "bodega-seascape.firebaseapp.com",

  projectId:
    "bodega-seascape",

  storageBucket:
    "bodega-seascape.firebasestorage.app",

  messagingSenderId:
    "634162820624",

  appId:
    "1:634162820624:web:6d67c35de7667fe07efc95"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   VARIABLES
========================= */

let usuarioActual = null;

let materiales = [];

let movimientos = [];


/* =========================
   INICIAR SESIÓN ANÓNIMA
========================= */

signInAnonymously(auth)

  .catch((error) => {

    console.error(
      "Error de autenticación:",
      error
    );

    document.getElementById("status").textContent =
      "🔴 Error Firebase: " +
      error.message;

    document.getElementById("status")
      .className = "status error";

  });


/* =========================
   AUTENTICACIÓN
========================= */

onAuthStateChanged(auth, (user) => {

  if(user){

    usuarioActual = user;

    document.getElementById("status").textContent =
      "🟢 Conectado · Inventario sincronizado";

    document.getElementById("status")
      .className = "status ok";

    iniciarEscuchaFirebase();

  }

});


/* =========================
   ESCUCHAR FIREBASE
========================= */

function iniciarEscuchaFirebase(){

  onSnapshot(

    collection(db,"materiales"),

    (snapshot) => {

      materiales =
        snapshot.docs.map(d => ({

          id:d.id,

          ...d.data()

        }));

      renderMateriales();

      actualizarSelector();

    },

    (error) => {

      console.error(
        "Error inventario:",
        error
      );

      document.getElementById("status").textContent =
        "🔴 Error inventario: " +
        error.message;

      document.getElementById("status")
        .className = "status error";

    }

  );


  const q =
    query(

      collection(db,"movimientos"),

      orderBy(
        "creadoEn",
        "desc"
      )

    );


  onSnapshot(

    q,

    (snapshot) => {

      movimientos =
        snapshot.docs.map(d => ({

          id:d.id,

          ...d.data()

        }));

      renderHistorial();

    },

    (error) => {

      console.error(
        "Error movimientos:",
        error
      );

    }

  );

}


/* =========================
   AGREGAR MATERIAL
========================= */

window.agregarMaterial =
async function(){

  const nombre =
    document
      .getElementById("nuevoNombre")
      .value
      .trim();


  const cantidad =
    Number(
      document
        .getElementById("nuevaCantidad")
        .value
    );


  const unidad =
    document
      .getElementById("nuevaUnidad")
      .value
      .trim();


  if(!nombre){

    alert(
      "Escribe el nombre del material"
    );

    return;

  }


  if(!unidad){

    alert(
      "Escribe la unidad"
    );

    return;

  }


  if(
    isNaN(cantidad) ||
    cantidad < 0
  ){

    alert(
      "Cantidad inválida"
    );

    return;

  }


  try{

    await addDoc(

      collection(
        db,
        "materiales"
      ),

      {

        nombre: nombre,

        cantidad: cantidad,

        unidad: unidad,

        creadoEn:
          serverTimestamp(),

        usuarioId:
          usuarioActual.uid

      }

    );


    document
      .getElementById(
        "nuevoNombre"
      )
      .value = "";


    document
      .getElementById(
        "nuevaCantidad"
      )
      .value = "";


    document
      .getElementById(
        "nuevaUnidad"
      )
      .value = "";


  }
  catch(error){

    console.error(error);

    alert(
      "No se pudo agregar: " +
      error.message
    );

  }

};


/* =========================
   REGISTRAR MOVIMIENTO
========================= */

window.registrarMovimiento =
async function(){

  const materialId =
    document
      .getElementById(
        "materialMovimiento"
      )
      .value;


  const tipo =
    document
      .getElementById(
        "tipoMovimiento"
      )
      .value;


  const cantidad =
    Number(
      document
        .getElementById(
          "cantidadMovimiento"
        )
        .value
    );


  const nota =
    document
      .getElementById(
        "notaMovimiento"
      )
      .value
      .trim();


  if(!materialId){

    alert(
      "Selecciona un material"
    );

    return;

  }


  if(
    isNaN(cantidad) ||
    cantidad <= 0
  ){

    alert(
      "Cantidad inválida"
    );

    return;

  }


  const material =
    materiales.find(
      m => m.id === materialId
    );


  if(!material){

    alert(
      "Material no encontrado"
    );

    return;

  }


  try{

    await runTransaction(

      db,

      async(transaction) => {

        const ref =
          doc(
            db,
            "materiales",
            materialId
          );


        const snap =
          await transaction.get(ref);


        if(!snap.exists()){

          throw new Error(
            "El material ya no existe"
          );

        }


        const data =
          snap.data();


        let nuevaCantidad =
          Number(
            data.cantidad || 0
          );


        if(tipo === "entrada"){

          nuevaCantidad +=
            cantidad;

        }
        else{

          if(
            nuevaCantidad <
            cantidad
          ){

            throw new Error(
              "No hay suficiente inventario"
            );

          }


          nuevaCantidad -=
            cantidad;

        }


        transaction.update(

          ref,

          {

            cantidad:
              nuevaCantidad

          }

        );


        const movimientoRef =
          doc(
            collection(
              db,
              "movimientos"
            )
          );


        transaction.set(

          movimientoRef,

          {

            nombre:
              data.nombre,

            unidad:
              data.unidad,

            tipo:
              tipo,

            cantidad:
              cantidad,

            nota:
              nota,

            creadoEn:
              serverTimestamp(),

            usuarioId:
              usuarioActual.uid

          }

        );

      }

    );


    document
      .getElementById(
        "cantidadMovimiento"
      )
      .value = "";


    document
      .getElementById(
        "notaMovimiento"
      )
      .value = "";


    alert(
      "Movimiento registrado correctamente"
    );


  }
  catch(error){

    console.error(error);

    alert(
      "No se pudo registrar: " +
      error.message
    );

  }

};


/* =========================
   INVENTARIO
========================= */

function renderMateriales(){

  const contenedor =
    document.getElementById(
      "listaMateriales"
    );


  if(
    materiales.length === 0
  ){

    contenedor.innerHTML =
      "<p>No hay materiales registrados.</p>";

    return;

  }


  const lista =
    [...materiales].sort(

      (a,b) =>

        (a.nombre || "")
          .localeCompare(
            b.nombre || ""
          )

    );


  contenedor.innerHTML =

    lista.map(m => `

      <div class="material">

        <div>

          <strong>
            ${escapar(m.nombre)}
          </strong>

          <div class="small">
            ${escapar(m.unidad || "")}
          </div>

        </div>

        <div class="qty">
          ${m.cantidad ?? 0}
        </div>

      </div>

    `).join("");

}


/* =========================
   SELECTOR
========================= */

function actualizarSelector(){

  const selector =
    document.getElementById(
      "materialMovimiento"
    );


  const valorActual =
    selector.value;


  selector.innerHTML =
    '<option value="">Seleccionar material</option>' +

    materiales

      .sort(

        (a,b) =>

          (a.nombre || "")
            .localeCompare(
              b.nombre || ""
            )

      )

      .map(m => `

        <option value="${m.id}">

          ${escapar(m.nombre)}
          (${m.cantidad ?? 0}
          ${escapar(m.unidad || "")})

        </option>

      `)

      .join("");


  if(
    materiales.some(
      m => m.id === valorActual
    )
  ){

    selector.value =
      valorActual;

  }

}


/* =========================
   HISTORIAL
========================= */

function renderHistorial(){

  aplicarFiltro();

}


function aplicarFiltro(){

  const contenedor =
    document.getElementById(
      "listaHistorial"
    );


  const fecha =
    document.getElementById(
      "filtroFecha"
    ).value;


  let lista =
    [...movimientos];


  if(fecha){

    lista =
      lista.filter(m => {

        if(!m.creadoEn)
          return false;


        const d =
          m.creadoEn.toDate();


        const año =
          d.getFullYear();


        const mes =
          String(
            d.getMonth()+1
          ).padStart(2,"0");


        const dia =
          String(
            d.getDate()
          ).padStart(2,"0");


        return (
          `${año}-${mes}-${dia}`
          === fecha
        );

      });

  }


  if(
    lista.length === 0
  ){

    contenedor.innerHTML =
      "<p>No hay movimientos.</p>";

    return;

  }


  contenedor.innerHTML =

    lista.map(m => {

      let fechaTexto =
        "Fecha pendiente";


      if(m.creadoEn){

        fechaTexto =
          m.creadoEn
            .toDate()
            .toLocaleString(
              "es-EC"
            );

      }


      return `

        <div class="history-item">

          <strong>
            ${escapar(m.nombre)}
          </strong>

          <span class="badge ${
            m.tipo === "entrada"
              ? "entry"
              : "exit"
          }">

            ${
              m.tipo === "entrada"
                ? "ENTRADA"
                : "SALIDA"
            }

          </span>

          <div>
            ${m.cantidad}
            ${escapar(
              m.unidad || ""
            )}
          </div>

          ${
            m.nota
              ? `<div class="small">
                   ${escapar(m.nota)}
                 </div>`
              : ""
          }

          <div class="small">
            ${fechaTexto}
          </div>

        </div>

      `;

    }).join("");

}


window.limpiarFiltro =
function(){

  document
    .getElementById(
      "filtroFecha"
    )
    .value = "";


  aplicarFiltro();

};


/* =========================
   CSV
========================= */

window.exportarCSV =
function(){

  let csv =
    "Fecha,Material,Tipo,Cantidad,Unidad,Nota\n";


  movimientos.forEach(m => {

    let fecha = "";


    if(m.creadoEn){

      fecha =
        m.creadoEn
          .toDate()
          .toLocaleString(
            "es-EC"
          );

    }


    csv += [

      fecha,

      m.nombre || "",

      m.tipo || "",

      m.cantidad || 0,

      m.unidad || "",

      m.nota || ""

    ]

    .map(
      v =>
        `"${String(v)
          .replace(/"/g,'""')}"`
    )

    .join(",") + "\n";

  });


  const blob =
    new Blob(

      ["\ufeff" + csv],

      {
        type:
          "text/csv;charset=utf-8;"
      }

    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "historial_bodega.csv";


  a.click();


  URL.revokeObjectURL(url);

};


/* =========================
   SECCIONES
========================= */

window.mostrarSeccion =
function(id,boton){

  document
    .querySelectorAll("section")
    .forEach(
      s =>
        s.classList.remove(
          "active"
        )
    );


  document
    .querySelectorAll(
      "nav button"
    )
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );


  document
    .getElementById(id)
    .classList.add(
      "active"
    );


  boton.classList.add(
    "active"
  );

};


/* =========================
   SEGURIDAD
========================= */

function escapar(valor){

  return String(
    valor ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   SERVICE WORKER
========================= */

if(
  "serviceWorker"
  in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register("sw.js")
        .catch(error =>
          console.log(
            "Service Worker:",
            error
          )
        );

    }
  );

}

</script>

</body>
</html>
