<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>BODEGA SEASCAPE</title>

<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;color:#d1d5db}

.status{
  margin:12px;
  padding:12px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}
.wait{background:#fef3c7;color:#92400e}
.ok{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}

nav{
  display:flex;
  background:white;
  border-bottom:1px solid #ddd;
}
nav button{
  flex:1;
  padding:14px 5px;
  border:0;
  background:white;
  font-weight:bold;
}
nav button.active{
  background:#111827;
  color:white;
}

section{
  display:none;
  padding:15px;
}
section.active{display:block}

.card{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 6px #0001;
}

input,select,button{
  width:100%;
  padding:11px;
  margin:5px 0;
  border-radius:7px;
  border:1px solid #ccc;
  font-size:15px;
}

button.primary{
  background:#111827;
  color:white;
  border:none;
}
